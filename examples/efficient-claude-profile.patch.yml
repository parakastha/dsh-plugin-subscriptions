# Apply this after installing examples/efficient-claude as a DSH agent preset.
# It removes the hidden title request and makes one Claude lane the default.
- id: agent-presets
  name: '@deepseek-ai/dsh-agent-presets'
  config:
    default: efficient-claude

- id: session-title-llm
  disabled: true

- id: llm-subscriptions
  name: dsh-plugin-subscriptions
  config:
    providers: [codex, claude]
    claude:
      maxConcurrentRequests: 1
      sessionStateTtlMs: 21600000
      cliMaxTurns: 1
    models:
      claude:
        - id: claude-opus-5
          name: Claude Opus 5 (Latest)
          maxTokens: 16000
          inputModalities: [text, image]
          reasoningEfforts: [low, medium, high, xhigh, max]
          defaultReasoningEffort: high
        - id: claude-sonnet-5
          name: Claude Sonnet 5 (Latest)
          maxTokens: 16000
          inputModalities: [text, image]
          reasoningEfforts: [low, medium, high, xhigh, max]
          defaultReasoningEffort: high
        - id: claude-haiku-4-5
          name: Claude Haiku 4.5
          maxTokens: 8000
          inputModalities: [text, image]
          reasoningEfforts: [low, medium, high]
          defaultReasoningEffort: high

- id: agent-default-model
  config:
    provider: claude
    model: claude-opus-5
